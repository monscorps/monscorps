# Publishes play-scope/ to GitHub Pages.
#
# configure-pages runs with `enablement: true`, so the first run turns Pages
# on by itself — no visit to the repository settings needed. Nothing outside
# play-scope/ is published.
name: Deploy Play Scope to Pages

on:
  push:
    branches: [main]
    paths:
      - 'play-scope/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages (enabling it if it is off)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload play-scope/ as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: play-scope

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
